name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync pytest --cov --cov-report=json:test-results/coverage.json
      - run: uv run --no-sync python scripts/check_coverage.py test-results/coverage.json
      - run: uv run --no-sync python scripts/check_sources.py
      - run: uv run --no-sync python scripts/check_metadata.py
      - run: uv run --no-sync ruff check src tests examples scripts
      - if: matrix.python == '3.12'
        run: uv run --no-sync mypy src/negotiator
      - run: uv run --no-sync python examples/custom_agent.py --output test-results/custom-agent
      - run: uv run --no-sync negotiator run examples/study.json --synthetic --output test-results/study
      - run: uv run --no-sync negotiator report test-results/study --output test-results/report
      - run: uv build
      - run: uv venv test-results/wheel-env --python ${{ matrix.python }}
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then wheel_python=test-results/wheel-env/Scripts/python.exe; else wheel_python=test-results/wheel-env/bin/python; fi
          uv pip install --python "$wheel_python" -c requirements.lock dist/*.whl
          "$wheel_python" scripts/check_install.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv
      - run: uv sync --locked --python 3.12
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/negotiator/web/static
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test -- --reporter=line
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
